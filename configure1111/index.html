<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Venture Holsteins Sale Editor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="editor.css?v=1"></head><body><main><section id="login" class="login"><div><p>PRIVATE EDITOR</p><h1>Venture Holsteins</h1><label>Access key<input id="key" type="password" autocomplete="current-password"></label><button id="open">Open Sale Editor</button><span id="loginError"></span></div></section><section id="editor" hidden><header><div><p>PRIVATE SALE EDITOR</p><h1>Tag Sale</h1></div><div class="header-actions"><a href="../venture-holsteins/sale/" target="_blank">View public page</a><button id="save">Save Changes</button></div></header><div id="status"></div><section class="settings"><label class="switch"><input id="isLive" type="checkbox"><b>Tag Sale is live</b><span>Turn off to show Coming Soon</span></label><label>Sale name<input id="saleName"></label><label>Dates<input id="dates"></label><label>Location<input id="location"></label><label>Coming Soon message<textarea id="comingSoon"></textarea></label><label>Contact link<input id="contactUrl"></label></section><div class="catalog-head"><h2>Sale Lots</h2><button id="add">+ Add Lot</button></div><section id="lots"></section><button id="bottomSave" class="bottom-save">Save Changes</button></section></main><script src="editor.js?v=1"></script></body></html>
