<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10261a">
  <meta name="description" content="A privately shared Venture Herd Manager milk-out and ring schedule.">
  <meta property="og:title" content="Venture Herd Manager · Shared Bagging Plan">
  <meta property="og:description" content="Open the shared cow milk-out and ring schedule.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://ventureagmarketing.com/assets/img/venture-herd-dashboard.png">
  <title>Shared Bagging Plan · Venture Herd Manager</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#eef3ee;font-family:Arial,sans-serif}body{display:grid;grid-template-rows:auto 1fr}.brand{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:8px 14px;background:#10261a;color:#fff;font-size:13px;font-weight:800;letter-spacing:.04em}.brand span{color:#d5b06d}.frame{width:100%;height:100%;border:0;background:#eef3ee}.error{display:none;max-width:560px;margin:40px auto;padding:20px;border:1px solid #d7c28d;border-radius:10px;background:#fff8e7;color:#352b16}
  </style>
</head>
<body>
  <div class="brand">VENTURE HERD MANAGER <span>·</span> SHARED BAGGING PLAN</div>
  <iframe id="bagging-plan" class="frame" title="Shared Venture Herd Manager bagging plan"></iframe>
  <div id="error" class="error">This share link is incomplete. Ask the sender to create a new bagging link.</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var site = params.get('site') === 'demo' ? 'demo' : 'live';
      if (!token || !/^[a-zA-Z0-9]{20,64}$/.test(token)) {
        document.getElementById('bagging-plan').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        return;
      }
      var origins = {
        live: 'https://ashy-sand-0956e200f.7.azurestaticapps.net',
        demo: 'https://delightful-sky-0c402ac0f.7.azurestaticapps.net'
      };
      document.getElementById('bagging-plan').src = origins[site] + '/shows/bagging/' + encodeURIComponent(token);
    }());
  </script>
</body>
</html>
